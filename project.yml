name: AnkiDesk
options:
  bundleIdPrefix: com.weizhi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  AnkiDesk:
    type: application
    platform: macOS
    sources: [AnkiDesk]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: AnkiDesk/Info.plist
      properties:
        CFBundleDisplayName: Anki Desk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.education
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weizhi.AnkiDesk

  AnkiDeskTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AnkiDeskTests]
    dependencies:
      - target: AnkiDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weizhi.AnkiDeskTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AnkiDesk:
    build:
      targets:
        AnkiDesk: all
        AnkiDeskTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AnkiDeskTests]
